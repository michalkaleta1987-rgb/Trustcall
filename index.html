<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FF6B3D">
<title>TrustCall</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #F5F1EA;
    --paper: #FFFEFB;
    --ink: #1A1815;
    --ink-soft: #6B6358;
    --accent: #FF6B3D;
    --safe: #4A9D5F;
    --alert: #D1453B;
    --warn: #D4A017;
    --dark: #2C2A26;
    --line: #E8E2D5;
    --mama-c: #B8956A;
    --shadow: 0 2px 8px rgba(26, 24, 21, 0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; overflow-x: hidden; }
  #app { min-height: 100vh; padding-bottom: 40px; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 16px; background: var(--paper); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 100; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--mama-c); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; }
  .header-name { font-size: 20px; font-weight: 700; }
  .header-icon { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; cursor: pointer; }
  .header-icon:active { background: var(--line); }
  .screen-content { padding: 16px 20px; }
  .section-label { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 10px; color: var(--ink-soft); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .badge-count { background: var(--ink); color: white; padding: 2px 10px; border-radius: 12px; font-size: 12px; }
  .idle-info { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .idle-info.green-tint { background: rgba(74, 157, 95, 0.08); border-color: rgba(74, 157, 95, 0.3); }
  .icon-circle { width: 36px; height: 36px; border-radius: 50%; background: var(--safe); color: white; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
  .idle-info .text { font-size: 15px; font-weight: 600; color: var(--safe); }
  .idle-info .sub { font-size: 13px; color: var(--ink-soft); margin-top: 4px; line-height: 1.4; }
  .contact-card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: transform 0.1s; }
  .contact-card:active { transform: scale(0.98); }
  .method-icon-big { width: 48px; height: 48px; border-radius: 12px; background: var(--mama-c); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; flex-shrink: 0; }
  .contact-info { flex: 1; min-width: 0; }
  .contact-name { font-size: 16px; font-weight: 600; }
  .contact-status { font-size: 13px; color: var(--ink-soft); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--safe); display: inline-block; }
  .contact-arrow { color: var(--ink-soft); font-size: 20px; }
  .fab { position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px; border-radius: 50%; background: var(--accent); color: white; border: none; font-size: 32px; cursor: pointer; box-shadow: 0 6px 20px rgba(255, 107, 61, 0.4); z-index: 50; display: flex; align-items: center; justify-content: center; }
  .fab:active { transform: scale(0.95); }
  .add-btn { width: 100%; padding: 16px; border: none; border-radius: 14px; background: var(--accent); color: white; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 12px; }
  .add-btn:active { opacity: 0.9; }
  .add-btn.secondary { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
  .choice-card { background: var(--paper); border: 2px solid var(--alert); border-radius: 18px; padding: 22px; margin-bottom: 14px; box-shadow: 0 12px 32px rgba(209, 69, 59, 0.2); }
  .choice-header { color: var(--alert); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .badge { width: 28px; height: 28px; border-radius: 50%; background: var(--alert); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
  .choice-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .choice-body { color: var(--ink-soft); margin-bottom: 18px; line-height: 1.5; }
  .choice-actions { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn { padding: 18px; border-radius: 14px; border: none; font-size: 17px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .choice-btn.confirm { background: var(--safe); color: white; }
  .choice-btn.deny { background: var(--alert); color: white; }
  .choice-btn:active { opacity: 0.85; }
  .waiting-card { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 32px 20px; text-align: center; margin-top: 20px; }
  .waiting-icon { width: 60px; height: 60px; border-radius: 50%; background: var(--accent); margin: 0 auto 16px; position: relative; }
  .waiting-icon::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 4px solid var(--accent); animation: pulse 1.5s ease-in-out infinite; opacity: 0.6; }
  @keyframes pulse { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.5); opacity: 0; } }
  .waiting-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .waiting-sub { color: var(--ink-soft); line-height: 1.5; margin-bottom: 18px; }
  .countdown { font-size: 32px; font-weight: 700; color: var(--accent); }
  .result-banner { padding: 28px 20px; border-radius: 18px; text-align: center; margin-top: 10px; }
  .result-banner.green { background: var(--safe); color: white; }
  .result-banner.red { background: var(--alert); color: white; }
  .result-banner.yellow { background: var(--warn); color: white; }
  .big-icon-r { font-size: 56px; display: block; margin-bottom: 10px; }
  .big-text { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
  .sub-text { font-size: 15px; line-height: 1.5; opacity: 0.95; }
  .subtitle { color: var(--ink-soft); margin-bottom: 14px; font-size: 14px; }
  .alarm-list { display: flex; flex-direction: column; gap: 6px; }
  .alarm-item { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .alarm-item.alert { border-left: 4px solid var(--alert); }
  .alarm-item.warn { border-left: 4px solid var(--warn); }
  .alarm-time { font-size: 12px; color: var(--ink-soft); margin-bottom: 3px; }
  .alarm-text { font-size: 14px; color: var(--ink); }
  .overlay-header { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
  .overlay-title { font-size: 18px; font-weight: 700; }
  .input-field { width: 100%; padding: 16px; border: 1px solid var(--line); border-radius: 12px; font-size: 18px; background: var(--paper); color: var(--ink); margin-bottom: 12px; }
  .input-field:focus { outline: none; border-color: var(--accent); }
  .label { font-size: 14px; color: var(--ink-soft); margin-bottom: 6px; }
  .code-display { font-family: 'Courier New', monospace; font-size: 36px; font-weight: 700; text-align: center; letter-spacing: 8px; background: var(--paper); border: 2px dashed var(--accent); padding: 24px; border-radius: 16px; margin: 16px 0; color: var(--accent); }
  .onboarding-screen { padding: 40px 24px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
  .onboarding-logo { font-size: 36px; font-weight: 700; color: var(--accent); margin-bottom: 8px; text-align: center; }
  .onboarding-tagline { color: var(--ink-soft); text-align: center; margin-bottom: 40px; font-size: 16px; }
  .onboarding-title { font-size: 26px; font-weight: 700; margin-bottom: 12px; text-align: center; }
  .onboarding-body { color: var(--ink-soft); margin-bottom: 32px; line-height: 1.5; text-align: center; }
  .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--ink); color: white; padding: 14px 24px; border-radius: 30px; font-size: 14px; z-index: 1000; max-width: 90%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
  .loading { display: inline-block; width: 20px; height: 20px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .center-loading { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .password-field { background: var(--paper); border: 2px solid var(--accent); border-radius: 14px; padding: 20px; margin: 16px 0; }
  .password-label { font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.5px; }
  .password-value { font-size: 22px; font-weight: 700; margin-top: 6px; letter-spacing: 2px; font-family: monospace; }
  .show-toggle { color: var(--accent); font-size: 14px; cursor: pointer; margin-top: 8px; display: inline-block; font-weight: 600; }
  .warning-banner { background: rgba(255, 107, 61, 0.08); border: 1px solid var(--accent); border-radius: 12px; padding: 12px; margin: 12px 0; font-size: 13px; color: var(--accent); line-height: 1.4; }
</style>
</head>
<body>
<div id="app">
  <div class="center-loading">
    <div class="loading"></div>
    <div style="margin-top: 12px;">Ładowanie TrustCall...</div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, query, where, onSnapshot, addDoc, serverTimestamp, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCWL4CZkiewsR2XSGk-GQ8TT0ZWby5VNhY",
    authDomain: "trustcall-8f770.firebaseapp.com",
    projectId: "trustcall-8f770",
    storageBucket: "trustcall-8f770.firebasestorage.app",
    messagingSenderId: "179064830897",
    appId: "1:179064830897:web:9ca77e708f7ab4f584db90"
  };

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = getFirestore(fbApp);

  // ===== STATE =====
  const state = {
    userId: null,           // Firebase anonymous ID
    userName: null,         // Imię użytkownika
    screen: 'loading',
    contacts: [],           // sparowane kontakty z Firestore
    pendingRequest: null,   // przychodzące pytanie (od innych)
    outgoingRequest: null,  // wysłane przeze mnie (czekam na odpowiedź)
    pairingCode: null,
    countdownTimer: null,
    countdown: 30,
    requestUnsubscribe: null,
    contactsUnsubscribe: null,
    showPassword: false
  };

  window.state = state;

  // ===== HELPERS =====
  function generateCode() {
    return Math.floor(100000 + Math.random() * 900000).toString();
  }

  function showToast(msg, ms = 2500) {
    const old = document.querySelector('.toast');
    if (old) old.remove();
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), ms);
  }

  function formatTime(ts) {
    if (!ts) return 'przed chwilą';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return 'przed chwilą';
    if (diff < 3600) return Math.floor(diff/60) + ' min temu';
    if (diff < 86400) return Math.floor(diff/3600) + 'h temu';
    return d.toLocaleDateString('pl-PL') + ', ' + d.toLocaleTimeString('pl-PL', {hour: '2-digit', minute: '2-digit'});
  }

  // ===== AUTH & INITIAL SETUP =====
  async function initialize() {
    try {
      await signInAnonymously(auth);
    } catch(e) {
      console.error('Auth error:', e);
      showToast('Błąd logowania: ' + e.message, 5000);
      return;
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        state.userId = user.uid;
        console.log('Zalogowany jako:', user.uid);

        // Sprawdź czy użytkownik istnieje w bazie (ma już imię)
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        if (userDoc.exists() && userDoc.data().name) {
          state.userName = userDoc.data().name;
          await onUserReady();
        } else {
          state.screen = 'onboarding';
          render();
        }
      }
    });
  }

  async function saveUserName(name) {
    if (!name || name.trim().length < 2) {
      showToast('Wpisz przynajmniej 2 znaki');
      return;
    }
    try {
      await setDoc(doc(db, 'users', state.userId), {
        name: name.trim(),
        createdAt: serverTimestamp()
      });
      state.userName = name.trim();
      await onUserReady();
    } catch(e) {
      console.error('Save error:', e);
      showToast('Błąd zapisu: ' + e.message, 4000);
    }
  }

  async function onUserReady() {
    state.screen = 'home';
    subscribeToContacts();
    subscribeToIncomingRequests();
    render();
  }

  // ===== CONTACTS (PARS) =====
  function subscribeToContacts() {
    if (state.contactsUnsubscribe) state.contactsUnsubscribe();
    const q = query(collection(db, 'pairings'), where('participants', 'array-contains', state.userId));
    state.contactsUnsubscribe = onSnapshot(q, async (snapshot) => {
      const contacts = [];
      for (const docSnap of snapshot.docs) {
        const data = docSnap.data();
        const otherId = data.participants.find(p => p !== state.userId);
        if (otherId) {
          // Pobierz imię drugiej osoby
          const otherUserDoc = await getDoc(doc(db, 'users', otherId));
          const otherName = otherUserDoc.exists() ? otherUserDoc.data().name : 'Nieznany';
          contacts.push({
            pairingId: docSnap.id,
            userId: otherId,
            name: otherName,
            createdAt: data.createdAt
          });
        }
      }
      state.contacts = contacts;
      if (state.screen === 'home' || state.screen === 'pairing-done') render();
    });
  }

  // ===== PAIRING =====
  async function startPairingAsHost() {
    const code = generateCode();
    state.pairingCode = code;
    try {
      await setDoc(doc(db, 'pairingCodes', code), {
        hostId: state.userId,
        hostName: state.userName,
        createdAt: serverTimestamp(),
        used: false
      });
      state.screen = 'pairing-host';
      render();

      // Słuchaj czy ktoś nie zeskanował kodu
      const unsub = onSnapshot(doc(db, 'pairingCodes', code), async (docSnap) => {
        if (docSnap.exists() && docSnap.data().used && docSnap.data().guestId) {
          const guestId = docSnap.data().guestId;
          const guestName = docSnap.data().guestName;

          // Stwórz parowanie
          const pairingId = [state.userId, guestId].sort().join('_');
          await setDoc(doc(db, 'pairings', pairingId), {
            participants: [state.userId, guestId],
            createdAt: serverTimestamp()
          });

          // Wyczyść kod
          await deleteDoc(doc(db, 'pairingCodes', code));

          unsub();
          state.pairingCode = null;
          showToast('Sparowano z ' + guestName + '!', 3000);
          state.screen = 'home';
          render();
        }
      });
    } catch(e) {
      console.error('Pairing host error:', e);
      showToast('Błąd: ' + e.message, 4000);
    }
  }

  async function joinPairing(code) {
    if (!/^\d{6}$/.test(code)) {
      showToast('Kod musi mieć 6 cyfr');
      return;
    }
    try {
      const codeDoc = await getDoc(doc(db, 'pairingCodes', code));
      if (!codeDoc.exists()) {
        showToast('Nieprawidłowy kod', 3000);
        return;
      }
      const data = codeDoc.data();
      if (data.used) {
        showToast('Kod już wykorzystany', 3000);
        return;
      }
      if (data.hostId === state.userId) {
        showToast('Nie można sparować się ze sobą', 3000);
        return;
      }

      // Sprawdź czy już są sparowani
      const pairingId = [state.userId, data.hostId].sort().join('_');
      const existing = await getDoc(doc(db, 'pairings', pairingId));
      if (existing.exists()) {
        showToast('Już jesteście sparowani', 3000);
        await deleteDoc(doc(db, 'pairingCodes', code));
        state.screen = 'home';
        render();
        return;
      }

      // Oznacz kod jako użyty
      await updateDoc(doc(db, 'pairingCodes', code), {
        used: true,
        guestId: state.userId,
        guestName: state.userName
      });

      showToast('Sparowano z ' + data.hostName + '!', 3000);
      state.screen = 'home';
      render();
    } catch(e) {
      console.error('Join error:', e);
      showToast('Błąd: ' + e.message, 4000);
    }
  }

  // ===== VERIFICATION REQUESTS =====
  function subscribeToIncomingRequests() {
    if (state.requestUnsubscribe) state.requestUnsubscribe();
    const q = query(
      collection(db, 'verifyRequests'),
      where('toUserId', '==', state.userId),
      where('status', '==', 'pending')
    );
    state.requestUnsubscribe = onSnapshot(q, (snapshot) => {
      snapshot.docChanges().forEach((change) => {
        if (change.type === 'added') {
          const data = change.doc.data();
          state.pendingRequest = {
            id: change.doc.id,
            fromUserId: data.fromUserId,
            fromName: data.fromName,
            timestamp: data.createdAt
          };
          render();
        }
      });
    });
  }

  async function sendVerifyRequest(toUserId, toName) {
    try {
      const docRef = await addDoc(collection(db, 'verifyRequests'), {
        fromUserId: state.userId,
        fromName: state.userName,
        toUserId: toUserId,
        toName: toName,
        status: 'pending',
        createdAt: serverTimestamp()
      });

      state.outgoingRequest = { id: docRef.id, toName: toName };
      state.screen = 'waiting';
      state.countdown = 30;
      render();
      startCountdown();
      listenForResponse(docRef.id);
    } catch(e) {
      console.error('Send request error:', e);
      showToast('Błąd: ' + e.message, 4000);
    }
  }

  function listenForResponse(requestId) {
    const unsub = onSnapshot(doc(db, 'verifyRequests', requestId), (docSnap) => {
      if (!docSnap.exists()) return;
      const data = docSnap.data();
      if (data.status !== 'pending') {
        if (state.countdownTimer) {
          clearInterval(state.countdownTimer);
          state.countdownTimer = null;
        }
        state.outgoingRequest = null;
        if (data.status === 'confirmed') state.screen = 'result-ok';
        else if (data.status === 'denied') state.screen = 'result-deny';
        else if (data.status === 'timeout') state.screen = 'result-timeout';
        render();
        unsub();
      }
    });
  }

  function startCountdown() {
    if (state.countdownTimer) clearInterval(state.countdownTimer);
    state.countdownTimer = setInterval(async () => {
      state.countdown--;
      const el = document.getElementById('countdown-display');
      if (el) el.textContent = state.countdown + 's';
      if (state.countdown <= 0) {
        clearInterval(state.countdownTimer);
        state.countdownTimer = null;
        // Oznacz jako timeout
        if (state.outgoingRequest) {
          try {
            await updateDoc(doc(db, 'verifyRequests', state.outgoingRequest.id), { status: 'timeout' });
          } catch(e) { console.error(e); }
        }
      }
    }, 1000);
  }

  async function respondToRequest(confirmed) {
    if (!state.pendingRequest) return;
    try {
      await updateDoc(doc(db, 'verifyRequests', state.pendingRequest.id), {
        status: confirmed ? 'confirmed' : 'denied',
        respondedAt: serverTimestamp()
      });
      const fromName = state.pendingRequest.fromName;
      state.pendingRequest = null;
      showToast(confirmed ? fromName + ' widzi ✓' : 'Wysłano alarm do ' + fromName, 3000);
      render();
    } catch(e) {
      console.error('Respond error:', e);
      showToast('Błąd: ' + e.message, 4000);
    }
  }

  // ===== NAVIGATION =====
  window.goHome = function() {
    state.screen = 'home';
    if (state.countdownTimer) { clearInterval(state.countdownTimer); state.countdownTimer = null; }
    state.outgoingRequest = null;
    render();
  };

  window.openPairing = function() {
    state.screen = 'pairing-choose';
    render();
  };

  window.cancelPairing = async function() {
    if (state.pairingCode) {
      try {
        await deleteDoc(doc(db, 'pairingCodes', state.pairingCode));
      } catch(e) {}
      state.pairingCode = null;
    }
    state.screen = 'home';
    render();
  };

  window.submitOnboarding = function() {
    const input = document.getElementById('name-input');
    if (input) saveUserName(input.value);
  };

  window.submitJoinCode = function() {
    const input = document.getElementById('join-code-input');
    if (input) joinPairing(input.value.trim());
  };

  window.verifyContact = function(userId, name) {
    sendVerifyRequest(userId, name);
  };

  window.respondYes = function() { respondToRequest(true); };
  window.respondNo = function() { respondToRequest(false); };
  window.cancelVerify = async function() {
    if (state.outgoingRequest) {
      try {
        await deleteDoc(doc(db, 'verifyRequests', state.outgoingRequest.id));
      } catch(e) {}
    }
    if (state.countdownTimer) { clearInterval(state.countdownTimer); state.countdownTimer = null; }
    state.outgoingRequest = null;
    state.screen = 'home';
    render();
  };

  window.startHostPairing = function() {
    startPairingAsHost();
  };

  window.startGuestPairing = function() {
    state.screen = 'pairing-guest';
    render();
  };

  // ===== RENDER =====
  function render() {
    const app = document.getElementById('app');
    let html = '';

    // Jeśli jest pending request - pokaż go natychmiast (priorytet)
    if (state.pendingRequest) {
      html = renderIncomingRequest();
    } else if (state.screen === 'loading') {
      html = '<div class="center-loading"><div class="loading"></div><div style="margin-top: 12px;">Ładowanie...</div></div>';
    } else if (state.screen === 'onboarding') {
      html = renderOnboarding();
    } else if (state.screen === 'home') {
      html = renderHome();
    } else if (state.screen === 'pairing-choose') {
      html = renderPairingChoose();
    } else if (state.screen === 'pairing-host') {
      html = renderPairingHost();
    } else if (state.screen === 'pairing-guest') {
      html = renderPairingGuest();
    } else if (state.screen === 'waiting') {
      html = renderWaiting();
    } else if (state.screen === 'result-ok') {
      html = renderResult('ok');
    } else if (state.screen === 'result-deny') {
      html = renderResult('deny');
    } else if (state.screen === 'result-timeout') {
      html = renderResult('timeout');
    }

    app.innerHTML = html;
  }

  function renderHeader() {
    const initial = state.userName ? state.userName.charAt(0).toUpperCase() : '?';
    return `
      <div class="header">
        <div class="header-left">
          <div class="avatar">${initial}</div>
          <div class="header-name">${state.userName || 'Nieznany'}</div>
        </div>
      </div>
    `;
  }

  function renderOnboarding() {
    return `
      <div class="onboarding-screen">
        <div class="onboarding-logo">🛡 TrustCall</div>
        <div class="onboarding-tagline">Sprawdź kto naprawdę dzwoni</div>
        <div class="onboarding-title">Cześć! Jak masz na imię?</div>
        <div class="onboarding-body">To imię zobaczą Twoi bliscy gdy ich sparujesz z aplikacją.</div>
        <input type="text" id="name-input" class="input-field" placeholder="np. Mama, Michał, Babcia Hania" maxlength="30" autofocus>
        <button class="add-btn" onclick="submitOnboarding()">Dalej</button>
      </div>
    `;
  }

  function renderHome() {
    const contactsHtml = state.contacts.length === 0 ? `
      <div class="idle-info">
        <div class="text" style="color: var(--ink-soft);">Nie masz jeszcze zaufanych osób</div>
        <div class="sub">Kliknij + na dole żeby sparować się z bliską osobą</div>
      </div>
    ` : state.contacts.map(c => `
      <div class="contact-card" onclick="verifyContact('${c.userId}', '${c.name.replace(/'/g, "\\'")}')">
        <div class="method-icon-big">${c.name.charAt(0).toUpperCase()}</div>
        <div class="contact-info">
          <div class="contact-name">${c.name}</div>
          <div class="contact-status"><span class="dot"></span> sparowany</div>
        </div>
        <div class="contact-arrow">›</div>
      </div>
    `).join('');

    return renderHeader() + `
      <div class="screen-content">
        <div class="subtitle">Twoi zaufani bliscy</div>
        <div class="idle-info green-tint">
          <div class="icon-circle">✓</div>
          <div class="text">Aktywna ochrona</div>
          <div class="sub">Kliknij osobę żeby sprawdzić czy to ona dzwoni</div>
        </div>
        <div class="section-label">
          <span>★ Zaufani</span>
          <span class="badge-count">${state.contacts.length}</span>
        </div>
        ${contactsHtml}
        <div class="warning-banner">
          💡 <strong>Tryb testowy:</strong> Aplikacja działa w 100% — może minąć kilka sekund zanim druga osoba dostanie pytanie weryfikacyjne.
        </div>
      </div>
      <button class="fab" onclick="openPairing()">+</button>
    `;
  }

  function renderPairingChoose() {
    return renderHeader() + `
      <div class="screen-content">
        <div class="overlay-header">
          <div class="overlay-title">Sparuj z bliską osobą</div>
        </div>
        <div class="onboarding-body" style="text-align: left; margin: 16px 0;">
          Wybierz jak chcesz się sparować. Najlepiej zrobić to gdy jesteście obok siebie.
        </div>
        <button class="add-btn" onclick="startHostPairing()" style="margin-top: 8px;">
          📲 Pokaż mój kod parowania
        </button>
        <button class="add-btn secondary" onclick="startGuestPairing()" style="margin-top: 10px;">
          ⌨️ Wpisz kod od drugiej osoby
        </button>
        <button class="add-btn secondary" onclick="goHome()" style="margin-top: 20px;">
          Anuluj
        </button>
      </div>
    `;
  }

  function renderPairingHost() {
    return renderHeader() + `
      <div class="screen-content">
        <div class="overlay-header">
          <div class="overlay-title">Twój kod parowania</div>
        </div>
        <div class="onboarding-body" style="text-align: left; margin: 16px 0;">
          Pokaż ten kod drugiej osobie. Ona musi go wpisać u siebie w aplikacji.
        </div>
        <div class="code-display">${state.pairingCode || '------'}</div>
        <div class="waiting-card">
          <div class="waiting-icon"></div>
          <div class="waiting-title">Czekam aż druga osoba wpisze kod...</div>
          <div class="waiting-sub">Kod ważny przez 10 minut. Gdy ktoś go wpisze — sparowanie nastąpi automatycznie.</div>
        </div>
        <button class="add-btn secondary" onclick="cancelPairing()" style="margin-top: 14px;">Anuluj</button>
      </div>
    `;
  }

  function renderPairingGuest() {
    return renderHeader() + `
      <div class="screen-content">
        <div class="overlay-header">
          <div class="overlay-title">Wpisz kod parowania</div>
        </div>
        <div class="onboarding-body" style="text-align: left; margin: 16px 0;">
          Wpisz 6-cyfrowy kod który pokazuje druga osoba w swojej aplikacji.
        </div>
        <input type="text" id="join-code-input" class="input-field" placeholder="------" maxlength="6" inputmode="numeric" autofocus style="font-family: monospace; font-size: 32px; text-align: center; letter-spacing: 8px;">
        <button class="add-btn" onclick="submitJoinCode()">Sparuj</button>
        <button class="add-btn secondary" onclick="goHome()" style="margin-top: 10px;">Anuluj</button>
      </div>
    `;
  }

  function renderIncomingRequest() {
    return renderHeader() + `
      <div class="screen-content">
        <div class="choice-card">
          <div class="choice-header">
            <div class="badge">!</div>
            PILNE — ${state.pendingRequest.fromName.toUpperCase()} CIĘ SPRAWDZA
          </div>
          <div class="choice-title">Czy dzwonisz teraz do ${state.pendingRequest.fromName}?</div>
          <div class="choice-body">
            ${state.pendingRequest.fromName} prowadzi rozmowę z kimś kto twierdzi że jest Tobą. Potwierdź lub zaprzecz — <strong>natychmiast</strong>.
          </div>
          <div class="choice-actions">
            <button class="choice-btn confirm" onclick="respondYes()">
              ✓ TAK, TO JA DZWONIĘ
            </button>
            <button class="choice-btn deny" onclick="respondNo()">
              ✕ NIE, TO NIE JA
            </button>
          </div>
        </div>
      </div>
    `;
  }

  function renderWaiting() {
    return renderHeader() + `
      <div class="screen-content">
        <div class="overlay-header">
          <div class="overlay-title">Sprawdzam ${state.outgoingRequest ? state.outgoingRequest.toName : ''}</div>
        </div>
        <div class="waiting-card">
          <div class="waiting-icon"></div>
          <div class="waiting-title">Pytamy prawdziwą osobę</div>
          <div class="waiting-sub">
            <strong>Nie podawaj danych ani pieniędzy.</strong><br>
            Wysłano powiadomienie. Czekamy aż druga osoba potwierdzi.
          </div>
          <div class="countdown" id="countdown-display">${state.countdown}s</div>
        </div>
        <button class="add-btn secondary" onclick="cancelVerify()" style="margin-top: 14px;">Anuluj sprawdzenie</button>
      </div>
    `;
  }

  function renderResult(type) {
    const banners = {
      ok: { cls:'green', icon:'✓', title:'To naprawdę ' + (state.outgoingRequest?.toName || 'oni'), sub:'Druga osoba potwierdziła.<br>Możesz spokojnie rozmawiać.' },
      deny: { cls:'red', icon:'✕', title:'TO NIE TA OSOBA', sub:'<strong>Ktoś się podszywa.</strong><br>Rozłącz się natychmiast.<br>Nie podawaj pieniędzy ani danych.' },
      timeout: { cls:'yellow', icon:'?', title:'Brak odpowiedzi', sub:'<strong>Bądź ostrożny.</strong><br>Nie wiemy czy to prawdziwa osoba. Zadzwoń sam z innego numeru.' }
    };
    const b = banners[type];
    return renderHeader() + `
      <div class="screen-content">
        <div class="result-banner ${b.cls}">
          <span class="big-icon-r">${b.icon}</span>
          <div class="big-text">${b.title}</div>
          <div class="sub-text">${b.sub}</div>
        </div>
        ${type === 'deny' ? '<button class="add-btn" style="background: var(--alert);">📞 Rozłącz natychmiast</button>' : ''}
        <button class="add-btn ${type === 'deny' ? 'secondary' : ''}" onclick="goHome()" style="margin-top: 14px;">Wróć do listy</button>
      </div>
    `;
  }

  // Start
  initialize();

  // Service worker registration
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
