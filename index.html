<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ff6b3d">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<title>TrustCall</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --phone-bg: #f5f0e6;
    --ink: #14171c;
    --ink-soft: #5a6068;
    --paper: #fbf7ef;
    --line: #e3dccd;
    --trust: #2d7a4f;
    --trust-soft: #d6ead9;
    --alert: #c0392b;
    --alert-soft: #fef1ee;
    --warn: #d4a017;
    --accent: #ff6b3d;
    --dark: #1a1d24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: 'Geist', sans-serif;
    background: var(--phone-bg);
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-font-smoothing: antialiased;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .safe-top { padding-top: env(safe-area-inset-top, 0px); }
  .demo-switcher {
    position: fixed;
    top: env(safe-area-inset-top, 12px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--dark);
    color: white;
    border-radius: 100px;
    padding: 6px 8px;
    z-index: 1000;
    font-size: 11px;
    font-family: 'Geist Mono', monospace;
    display: flex;
    gap: 4px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    margin-top: 8px;
  }
  .demo-switcher button {
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.6);
    padding: 6px 12px;
    border-radius: 100px;
    font-family: inherit;
    font-size: inherit;
    cursor: pointer;
    letter-spacing: 0.05em;
  }
  .demo-switcher button.active {
    background: var(--accent);
    color: white;
    font-weight: 600;
  }
  .app {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    padding-top: calc(env(safe-area-inset-top, 0px) + 56px);
  }
  .app-header {
    padding: 8px 24px 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .app-name {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 32px;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .app-name .mark { font-style: italic; color: var(--accent); }
  .user-pill {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 6px 10px 6px 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .user-pill .mini-avatar {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #d4501f);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 11px;
    font-weight: 600;
    font-family: 'Fraunces', serif;
  }
  .user-pill .mini-avatar.mama-c { background: linear-gradient(135deg, #c97d5d, #8b4f3a); }
  .screen-content {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 24px 24px;
    -webkit-overflow-scrolling: touch;
  }
  .subtitle {
    color: var(--ink-soft);
    font-size: 13px;
    margin-bottom: 20px;
    line-height: 1.4;
  }
  .section-label {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 12px;
    margin-top: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .section-label:first-child { margin-top: 0; }
  .section-label .badge-count {
    background: var(--ink);
    color: var(--paper);
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 10px;
  }
  .idle-info {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    text-align: center;
    margin-bottom: 8px;
  }
  .idle-info.green-tint {
    background: var(--trust-soft);
    border-color: rgba(45, 122, 79, 0.3);
  }
  .idle-info .icon-circle {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: white;
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin: 0 auto 10px;
  }
  .idle-info .text {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .idle-info .sub {
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.4;
  }
  .contact-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
    transition: transform 0.15s, border-color 0.15s;
    cursor: pointer;
  }
  .contact-card:active { transform: scale(0.98); }
  .contact-card.highlight {
    border-color: var(--alert);
    background: var(--alert-soft);
    border-width: 2px;
    animation: pulseBorder 1.5s infinite;
  }
  @keyframes pulseBorder {
    0%, 100% { box-shadow: 0 0 0 0 rgba(192, 57, 43, 0.3); }
    50% { box-shadow: 0 0 0 8px rgba(192, 57, 43, 0); }
  }
  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 600;
    font-size: 17px;
    font-family: 'Fraunces', serif;
    flex-shrink: 0;
  }
  .avatar.son { background: linear-gradient(135deg, var(--accent), #d4501f); }
  .avatar.mama { background: linear-gradient(135deg, #c97d5d, #8b4f3a); }
  .avatar.tata { background: linear-gradient(135deg, #5d7da6, #3a5478); }
  .avatar.sister { background: linear-gradient(135deg, #a65d9c, #784172); }
  .avatar.husband { background: linear-gradient(135deg, #5d7da6, #3a5478); }
  .avatar.neighbor { background: linear-gradient(135deg, #7a8b5d, #4f6837); }
  .contact-info { flex: 1; min-width: 0; }
  .contact-name { font-weight: 600; color: var(--ink); font-size: 15px; }
  .contact-status {
    font-size: 11px;
    color: var(--trust);
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 2px;
  }
  .contact-status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--trust);
  }
  .contact-arrow { color: var(--ink-soft); opacity: 0.4; font-size: 18px; }
  .add-btn {
    width: 100%;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 16px;
    border-radius: 16px;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    margin-top: 8px;
    transition: transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .add-btn:active { transform: scale(0.98); }
  .overlay {
    position: absolute;
    inset: 0;
    background: var(--phone-bg);
    z-index: 100;
    display: flex;
    flex-direction: column;
    padding-top: calc(env(safe-area-inset-top, 0px) + 56px);
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }
  .overlay-header {
    padding: 8px 24px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .back-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--paper);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    color: var(--ink);
  }
  .overlay-title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.02em;
  }
  .overlay-body {
    flex: 1;
    padding: 0 24px 24px;
    overflow-y: auto;
  }

  /* METHOD PICKER (po wybraniu kontaktu) */
  .method-picker {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .method-card {
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: all 0.15s;
    text-align: left;
    width: 100%;
    font-family: inherit;
  }
  .method-card:active { transform: scale(0.98); }
  .method-card.recommended {
    border-color: var(--accent);
    background: white;
    box-shadow: 0 4px 16px rgba(255, 107, 61, 0.1);
  }
  .method-icon-big {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: var(--ink);
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .method-card.recommended .method-icon-big { background: var(--accent); color: white; }
  .method-text { flex: 1; }
  .method-name-l {
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 3px;
  }
  .method-name-l .tag {
    display: inline-block;
    background: var(--accent);
    color: white;
    font-size: 9px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 100px;
    margin-left: 6px;
    letter-spacing: 0.05em;
    vertical-align: middle;
  }
  .method-desc-l {
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.35;
  }

  /* PASSWORD BIG DISPLAY */
  .password-display {
    background: var(--ink);
    color: var(--paper);
    border-radius: 22px;
    padding: 32px 24px;
    margin: 16px 0;
    text-align: center;
  }
  .password-label {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.6;
    margin-bottom: 12px;
  }
  .password-value {
    font-family: 'Fraunces', serif;
    font-size: 38px;
    font-weight: 700;
    letter-spacing: 0.02em;
    word-break: break-word;
    line-height: 1.1;
  }
  .password-value.hidden {
    filter: blur(14px);
  }
  .password-hint {
    color: var(--ink-soft);
    font-size: 12px;
    margin-top: 16px;
    line-height: 1.5;
  }
  .show-toggle {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    color: white;
    padding: 8px 16px;
    border-radius: 100px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    margin-top: 16px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  /* TOTP DISPLAY */
  .totp-display {
    background: var(--ink);
    color: var(--paper);
    border-radius: 22px;
    padding: 28px 24px;
    margin: 16px 0;
    text-align: center;
  }
  .totp-code {
    font-family: 'Geist Mono', monospace;
    font-size: 44px;
    font-weight: 600;
    letter-spacing: 0.1em;
    margin: 12px 0;
  }
  .totp-progress {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 100px;
    overflow: hidden;
    margin: 12px 0 4px;
  }
  .totp-progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 100px;
    transition: width 1s linear;
  }
  .totp-timer {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    opacity: 0.6;
    letter-spacing: 0.1em;
  }

  /* WAITING */
  .waiting-card {
    background: var(--paper);
    border: 2px solid var(--warn);
    border-radius: 20px;
    padding: 32px 20px;
    margin: 16px 0;
    text-align: center;
  }
  .waiting-icon {
    width: 56px;
    height: 56px;
    border: 4px solid var(--warn);
    border-top-color: transparent;
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .waiting-title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .waiting-sub {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.4;
  }
  .countdown {
    font-family: 'Geist Mono', monospace;
    font-size: 13px;
    color: var(--warn);
    margin-top: 12px;
    font-weight: 600;
  }

  /* RESULT BANNERS */
  .result-banner {
    border-radius: 22px;
    padding: 32px 20px;
    margin: 16px 0;
    text-align: center;
    animation: bigPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes bigPop {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .result-banner.green { background: var(--trust); color: white; box-shadow: 0 12px 32px rgba(45, 122, 79, 0.3); }
  .result-banner.red { background: var(--alert); color: white; box-shadow: 0 12px 32px rgba(192, 57, 43, 0.3); }
  .result-banner.yellow { background: var(--warn); color: white; box-shadow: 0 12px 32px rgba(212, 160, 23, 0.3); }
  .result-banner .big-icon-r { font-size: 64px; margin-bottom: 12px; display: block; line-height: 1; font-weight: 700; }
  .result-banner .big-text {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 10px;
  }
  .result-banner .sub-text {
    font-size: 14px;
    opacity: 0.95;
    line-height: 1.4;
  }

  /* CHOICE CARD (na widoku syna) */
  .choice-card {
    background: var(--paper);
    border: 3px solid var(--alert);
    border-radius: 22px;
    padding: 20px;
    margin: 16px 0;
    box-shadow: 0 12px 32px rgba(192, 57, 43, 0.2);
    animation: bigPop 0.4s ease;
  }
  .choice-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--alert);
    margin-bottom: 12px;
    font-weight: 600;
  }
  .choice-header .badge {
    width: 20px;
    height: 20px;
    background: var(--alert);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 12px;
    font-family: inherit;
  }
  .choice-title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 8px;
    letter-spacing: -0.01em;
    line-height: 1.15;
  }
  .choice-body {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin-bottom: 18px;
  }
  .choice-body strong { color: var(--ink); }
  .choice-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .choice-btn {
    padding: 18px;
    border-radius: 14px;
    border: none;
    font-family: inherit;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .choice-btn:active { transform: scale(0.97); }
  .choice-btn.confirm { background: var(--trust); color: white; }
  .choice-btn.deny { background: var(--alert); color: white; }
  .choice-btn .icon-l { font-size: 22px; }

  /* SETTINGS LIST */
  .settings-group {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .settings-row {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-row:active { background: var(--line); }
  .settings-row .lbl { flex: 1; font-size: 14px; color: var(--ink); font-weight: 500; }
  .settings-row .val {
    font-size: 12px;
    color: var(--ink-soft);
    font-family: 'Geist Mono', monospace;
  }
  .settings-row .check {
    color: var(--trust);
    font-size: 20px;
    font-weight: 700;
  }

  /* FAB */
  .fab {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    right: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    border: none;
    font-size: 28px;
    box-shadow: 0 8px 24px rgba(255, 107, 61, 0.4);
    cursor: pointer;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fab:active { transform: scale(0.92); }

  /* PUSH NOTIFICATION (z góry, jak prawdziwa) */
  .push-notif {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 60px);
    left: 16px;
    right: 16px;
    background: var(--dark);
    color: white;
    border-radius: 18px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 200;
    box-shadow: 0 12px 32px rgba(0,0,0,0.3);
    animation: pushSlideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: pointer;
  }
  @keyframes pushSlideIn {
    from { transform: translateY(-120%); }
    to { transform: translateY(0); }
  }
  .push-notif.alert { background: var(--alert); }
  .push-notif .pn-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 18px;
  }
  .push-notif .pn-text { flex: 1; }
  .push-notif .pn-title { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
  .push-notif .pn-body { font-size: 12px; opacity: 0.85; line-height: 1.3; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: white;
    padding: 12px 20px;
    border-radius: 100px;
    font-size: 13px;
    z-index: 200;
    animation: toastUp 0.3s ease;
    max-width: 90%;
    text-align: center;
  }
  @keyframes toastUp {
    from { transform: translate(-50%, 30px); opacity: 0; }
    to { transform: translate(-50%, 0); opacity: 1; }
  }

  /* TIMELINE */
  .alarm-list { display: flex; flex-direction: column; gap: 8px; }
  .alarm-item {
    background: var(--paper);
    border: 1px solid var(--line);
    border-left: 4px solid var(--trust);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .alarm-item.alert { border-left-color: var(--alert); }
  .alarm-item.warn { border-left-color: var(--warn); }
  .alarm-time {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    margin-bottom: 4px;
    letter-spacing: 0.05em;
  }
  .alarm-text { font-size: 13px; color: var(--ink); }
  .alarm-text strong { font-weight: 600; }

  /* QR */
  .qr-frame {
    background: white;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 20px;
    margin: 0 auto 20px;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.06);
  }
  .qr-code { width: 180px; height: 180px; }
  .pairing-screen { text-align: center; padding: 16px 0; }
  .pairing-title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 700;

// QR placeholder
function makeQR() {
  const size = 21;
  const cells = [];
  let r = 0xDEADBEEF;
  for (let i = 0; i < size * size; i++) {
    r = (r * 1103515245 + 12345) & 0x7FFFFFFF;
    cells.push(r % 2);
  }
  function setFinder(x, y) {
    for (let dy = 0; dy < 7; dy++) {
      for (let dx = 0; dx < 7; dx++) {
        const idx = (y + dy) * size + (x + dx);
        const edge = dx === 0 || dy === 0 || dx === 6 || dy === 6;
        const inner = dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4;
        cells[idx] = (edge || inner) ? 1 : 0;
      }
    }
  }
  setFinder(0, 0); setFinder(size - 7, 0); setFinder(0, size - 7);
  let svg = '<svg class="qr-code" viewBox="0 0 ' + size + ' ' + size + '" xmlns="http://www.w3.org/2000/svg">';
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      if (cells[y * size + x]) svg += `<rect x="${x}" y="${y}" width="1" height="1" fill="#14171c"/>`;
    }
  }
  svg += '</svg>';
  return svg;
}

  return code;
}
function getTOTPSecondsLeft() {

function getDailyPassword() {

  const day = Math.floor(Date.now() / 86400000);
  return words[day % words.length] + '-' + ((day * 7) % 100);
}

// ====== GŁÓWNY RENDER ======
function render() {
  const app = document.getElementById('app');
  let html = '';

  if (state.screen === 'pairing') html = renderPairing();
  else if (state.screen === 'settings') html = renderSettings();
  else if (state.view === 'mama') {
    if (state.screen === 'home') html = renderMamaHome();
    else if (state.screen === 'choose-method') html = renderChooseMethod(state.currentContactId);
    else if (state.screen === 'waiting') html = renderWaitingForSon();
    else if (state.screen === 'result-ok') html = renderMamaResult('ok');
    else if (state.screen === 'result-deny') html = renderMamaResult('deny');
    else if (state.screen === 'result-timeout') html = renderMamaResult('timeout');
    else if (state.screen === 'password-method') html = renderPasswordMethod();
    else if (state.screen === 'totp-method') html = renderTOTPMethod();
    else if (state.screen === 'daily-method') html = renderDailyMethod();
  } else {
    if (state.screen === 'home') html = renderSonHome();
    else if (state.screen === 'choose-method') html = renderChooseMethod(state.currentContactId);
    else if (state.screen === 'answered-yes') html = renderSonAnswered(true);
    else if (state.screen === 'answered-no') html = renderSonAnswered(false);
    else if (state.screen === 'son-totp') html = renderSonTOTP();
    else if (state.screen === 'son-daily') html = renderSonDaily();
  }
  app.innerHTML = html;
}

// ====== ACTIONS ======
function switchView(view) {
  state.view = view;
  // NIE resetujemy ekranu — każdy widok pamięta gdzie był
  document.getElementById('view-mama').classList.toggle('active', view === 'mama');
  document.getElementById('view-son').classList.toggle('active', view === 'son');

  // Jeśli wracamy na widok Mamy a jest gotowy wynik weryfikacji, pokaż go
  if (view === 'mama' && state.pendingResult && state.mamaScreen === 'waiting') {
    if (state.pendingResult.result === 'ok') state.mamaScreen = 'result-ok';
    else if (state.pendingResult.result === 'deny') state.mamaScreen = 'result-deny';
    if (state.countdownTimer) { clearInterval(state.countdownTimer); state.countdownTimer = null; }
  }

  render();
}

function goHome() {
  state.screen = 'home';  // używa settera - tylko aktualny widok
  state.pairingStep = 0;
  state.currentContactId = null;
  // Wyczyść pending tylko gdy obie strony zobaczyły wynik
  if (state.view === 'mama' && (state.mamaScreen === 'home')) {
    // jeśli wracamy z wyniku Mamy do home, można czyścić pending
    if (state.sonScreen === 'home' || state.sonScreen === 'answered-yes' || state.sonScreen === 'answered-no') {
      state.pendingRequest = null;
      state.pendingResult = null;
    }
  }
  if (state.countdownTimer) { clearInterval(state.countdownTimer); state.countdownTimer = null; }
  stopTOTP();
  render();
}

function openSettings() {
  state.screen = 'settings';
  render();
}

function openPairing() {
  state.screen = 'pairing';
  state.pairingStep = 0;
  render();
}

function chooseVerifyMethod(contactId) {
  state.currentContactId = contactId;
  state.screen = 'choose-method';
  render();
}

// Push verify - prawdziwy flow z komunikacją między widokami
function startPushVerify(contactId) {
  state.pendingRequest = { from: 'mama', to: contactId, timestamp: Date.now() };
  state.pendingResult = null;
  state.screen = 'waiting';
  state.countdown = 30;
  showToast('Wysłano powiadomienie do Syna');
  startCountdown();
  render();
}

function startCountdown() {
  if (state.countdownTimer) clearInterval(state.countdownTimer);
  state.countdownTimer = setInterval(() => {
    state.countdown--;
    const el = document.getElementById('countdown-display');
    if (el) el.textContent = `Pozostało ${state.countdown}s`;
    // sprawdź czy jest odpowiedź
    if (state.pendingResult) {
      clearInterval(state.countdownTimer);
      state.countdownTimer = null;
      if (state.pendingResult.result === 'ok') state.mamaScreen = 'result-ok';
      else if (state.pendingResult.result === 'deny') state.mamaScreen = 'result-deny';
      if (state.view === 'mama') render();
      return;
    }
    if (state.countdown <= 0) {
      clearInterval(state.countdownTimer);
      state.countdownTimer = null;
      state.mamaScreen = 'result-timeout';
      if (state.view === 'mama') render();
    }
  }, 1000);
}

function cancelVerify() {
  state.pendingRequest = null;
  state.pendingResult = null;
  if (state.countdownTimer) { clearInterval(state.countdownTimer); state.countdownTimer = null; }
  goHome();
}

// Syn odpowiada na pytanie
function sonAnswer(confirmed) {
  state.pendingResult = { result: confirmed ? 'ok' : 'deny' };
  state.sonScreen = confirmed ? 'answered-yes' : 'answered-no';
  // Również już teraz zaktualizuj ekran Mamy, żeby gdy przełączysz widok zobaczyła wynik
  if (state.mamaScreen === 'waiting') {
    state.mamaScreen = confirmed ? 'result-ok' : 'result-deny';
    if (state.countdownTimer) { clearInterval(state.countdownTimer); state.countdownTimer = null; }
  }
  showToast(confirmed ? 'Mama widzi: zielone ✓ (przełącz na MAMA)' : 'Mama widzi: ⚠ alarm (przełącz na MAMA)');
  render();
}

// Pokaż widoki haseł zapasowych
function showPasswordMethod(contactId) {
  state.currentContactId = contactId;
  state.screen = 'password-method';
  render();
}
function showTOTPMethod(contactId) {
  state.currentContactId = contactId;
  state.screen = 'totp-method';
  startTOTPRefresh();
  render();
}
function showDailyMethod(contactId) {
  state.currentContactId = contactId;
  state.screen = 'daily-method';
  render();
}
function togglePassword() {
  state.settings.showPassword = !state.settings.showPassword;
  render();
}
function passwordResult(result) {
  stopTOTP();
  if (result === 'ok') state.screen = 'result-ok';
  else state.screen = 'result-deny';
  render();
}
function startTOTPRefresh() {
  if (state.totpInterval) clearInterval(state.totpInterval);
  state.totpInterval = setInterval(() => {
    if (state.screen === 'totp-method' || state.screen === 'son-totp') {
      render();
    }
  }, 1000);
}
function stopTOTP() {
  if (state.totpInterval) { clearInterval(state.totpInterval); state.totpInterval = null; }
}

function setFallback(method) {
  state.settings.fallbackMethod = method;
  showToast('Zmieniono metodę zapasową');
  render();
}

function editPassword() {
  const newPw = prompt('Wpisz nowe wspólne hasło bezpieczeństwa:', state.settings.securityPassword);
  if (newPw && newPw.trim()) {
    state.settings.securityPassword = newPw.trim();
    showToast('Zmieniono hasło');
    render();
  }
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

// ====== INIT ======
render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
