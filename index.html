<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ff6b3d">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<title>TrustCall</title>

<link rel="manifest" href="manifest.json">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --phone-bg: #f5f0e6;
    --ink: #14171c;
    --ink-soft: #5a6068;
    --paper: #fbf7ef;
    --line: #e3dccd;
    --trust: #2d7a4f;
    --trust-soft: #d6ead9;
    --alert: #c0392b;
    --alert-soft: #fef1ee;
    --warn: #d4a017;
    --accent: #ff6b3d;
    --dark: #1a1d24;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: 'Geist', sans-serif;
    background: var(--phone-bg);
    color: var(--ink);
    -webkit-user-select: none;
    user-select: none;
    -webkit-font-smoothing: antialiased;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Status bar spacer for notch */
  .safe-top { padding-top: env(safe-area-inset-top, 0px); }
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }

  /* DEMO MODE SWITCHER */
  .demo-switcher {
    position: fixed;
    top: env(safe-area-inset-top, 12px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--dark);
    color: white;
    border-radius: 100px;
    padding: 6px 8px;
    z-index: 1000;
    font-size: 11px;
    font-family: 'Geist Mono', monospace;
    display: flex;
    gap: 4px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    margin-top: 8px;
  }

  .demo-switcher button {
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.6);
    padding: 6px 12px;
    border-radius: 100px;
    font-family: inherit;
    font-size: inherit;
    cursor: pointer;
    letter-spacing: 0.05em;
  }

  .demo-switcher button.active {
    background: var(--accent);
    color: white;
    font-weight: 600;
  }

  /* APP CONTAINER */
  .app {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    padding-top: calc(env(safe-area-inset-top, 0px) + 56px);
  }

  /* HEADER */
  .app-header {
    padding: 8px 24px 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .app-name {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 32px;
    letter-spacing: -0.03em;
    line-height: 1;
  }

  .app-name .mark { font-style: italic; color: var(--accent); }

  .user-pill {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 6px 10px 6px 6px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .user-pill .mini-avatar {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #d4501f);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 11px;
    font-weight: 600;
    font-family: 'Fraunces', serif;
  }

  .user-pill .mini-avatar.mama-c { background: linear-gradient(135deg, #c97d5d, #8b4f3a); }

  /* SCREEN CONTENT */
  .screen-content {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 24px 24px;
    -webkit-overflow-scrolling: touch;
  }

  /* SUBTITLE */
  .subtitle {
    color: var(--ink-soft);
    font-size: 13px;
    margin-bottom: 20px;
    line-height: 1.4;
  }

  /* SECTIONS */
  .section-label {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 12px;
    margin-top: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .section-label:first-child { margin-top: 0; }

  .section-label .badge-count {
    background: var(--ink);
    color: var(--paper);
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 10px;
  }

  /* IDLE INFO CARD */
  .idle-info {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    text-align: center;
    margin-bottom: 8px;
  }

  .idle-info.green-tint {
    background: var(--trust-soft);
    border-color: rgba(45, 122, 79, 0.3);
  }

  .idle-info .icon-circle {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: white;
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin: 0 auto 10px;
  }

  .idle-info .text {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 4px;
  }

  .idle-info .sub {
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.4;
  }

  /* CONTACT CARDS */
  .contact-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
    transition: transform 0.15s, border-color 0.15s;
    cursor: pointer;
  }

  .contact-card:active { transform: scale(0.98); }

  .contact-card.highlight {
    border-color: var(--alert);
    background: var(--alert-soft);
    border-width: 2px;
    animation: pulseBorder 1.5s infinite;
  }

  @keyframes pulseBorder {
    0%, 100% { box-shadow: 0 0 0 0 rgba(192, 57, 43, 0.3); }
    50% { box-shadow: 0 0 0 8px rgba(192, 57, 43, 0); }
  }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 600;
    font-size: 17px;
    font-family: 'Fraunces', serif;
    flex-shrink: 0;
  }

  .avatar.son { background: linear-gradient(135deg, var(--accent), #d4501f); }
  .avatar.mama { background: linear-gradient(135deg, #c97d5d, #8b4f3a); }
  .avatar.tata { background: linear-gradient(135deg, #5d7da6, #3a5478); }
  .avatar.sister { background: linear-gradient(135deg, #a65d9c, #784172); }
  .avatar.husband { background: linear-gradient(135deg, #5d7da6, #3a5478); }
  .avatar.neighbor { background: linear-gradient(135deg, #7a8b5d, #4f6837); }

  .contact-info { flex: 1; min-width: 0; }
  .contact-name {
    font-weight: 600;
    color: var(--ink);
    font-size: 15px;
  }
  .contact-status {
    font-size: 11px;
    color: var(--trust);
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 2px;
  }

  .contact-status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--trust);
  }

  .contact-arrow {
    color: var(--ink-soft);
    opacity: 0.4;
    font-size: 18px;
  }

  /* ADD BUTTON */
  .add-btn {
    width: 100%;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 16px;
    border-radius: 16px;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    margin-top: 8px;
    transition: transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .add-btn:active { transform: scale(0.98); }

  /* BIG VERIFY BUTTON (mama main action) */
  .big-verify-btn {
    background: var(--alert);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 22px 16px;
    font-family: inherit;
    width: 100%;
    margin: 16px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    box-shadow: 0 10px 30px rgba(192, 57, 43, 0.35);
    cursor: pointer;
    transition: transform 0.15s;
  }

  .big-verify-btn:active { transform: scale(0.97); }

  .big-verify-btn .icon-large { font-size: 36px; line-height: 1; margin-bottom: 4px; }

  .big-verify-btn .main-text {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: -0.01em;
  }

  .big-verify-btn .sub-text {
    font-size: 11px;
    opacity: 0.9;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 500;
  }

  /* FULL SCREEN OVERLAYS */
  .overlay {
    position: absolute;
    inset: 0;
    background: var(--phone-bg);
    z-index: 100;
    display: flex;
    flex-direction: column;
    padding-top: calc(env(safe-area-inset-top, 0px) + 56px);
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }

  .overlay-header {
    padding: 8px 24px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .back-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--paper);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    color: var(--ink);
  }

  .overlay-title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.02em;
  }

  .overlay-body {
    flex: 1;
    padding: 0 24px 24px;
    overflow-y: auto;
  }

  /* QR / PAIRING */
  .pairing-screen {
    text-align: center;
    padding: 16px 0;
  }

  .pairing-step-label {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .pairing-title {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 8px;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  .pairing-desc {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin-bottom: 24px;
    padding: 0 12px;
  }

  .method-tabs {
    display: flex;
    gap: 6px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 4px;
    margin-bottom: 20px;
  }

  .method-tab {
    flex: 1;
    background: transparent;
    border: none;
    padding: 10px 8px;
    border-radius: 100px;
    font-family: inherit;
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
    font-weight: 500;
  }

  .method-tab.active {
    background: var(--ink);
    color: white;
    font-weight: 600;
  }

  .qr-frame {
    background: white;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 20px;
    margin: 0 auto 20px;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.06);
  }

  .qr-code {
    width: 180px;
    height: 180px;
  }

  .pairing-code-display {
    background: var(--ink);
    color: var(--paper);
    padding: 16px 24px;
    border-radius: 14px;
    margin: 0 auto;
    display: inline-block;
  }

  .pairing-code-label {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.6;
    margin-bottom: 6px;
  }

  .pairing-code-value {
    font-family: 'Geist Mono', monospace;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 0.15em;
  }

  .scan-frame {
    width: 240px;
    height: 240px;
    margin: 0 auto;
    border-radius: 20px;
    background: var(--ink);
    position: relative;
    overflow: hidden;
  }

  .scan-corner {
    position: absolute;
    width: 30px;
    height: 30px;
    border: 3px solid var(--accent);
  }

  .scan-corner.tl { top: 12px; left: 12px; border-right: none; border-bottom: none; border-top-left-radius: 8px; }
  .scan-corner.tr { top: 12px; right: 12px; border-left: none; border-bottom: none; border-top-right-radius: 8px; }
  .scan-corner.bl { bottom: 12px; left: 12px; border-right: none; border-top: none; border-bottom-left-radius: 8px; }
  .scan-corner.br { bottom: 12px; right: 12px; border-left: none; border-top: none; border-bottom-right-radius: 8px; }

  .scan-laser {
    position: absolute;
    left: 12px;
    right: 12px;
    height: 2px;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    animation: scanMove 2s linear infinite;
  }

  @keyframes scanMove {
    0% { top: 12px; }
    50% { top: calc(100% - 14px); }
    100% { top: 12px; }
  }

  /* RESULT BANNERS */
  .result-banner {
    border-radius: 22px;
    padding: 32px 20px;
    margin: 16px 0;
    text-align: center;
    animation: bigPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes bigPop {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .result-banner.green {
    background: var(--trust);
    color: white;
    box-shadow: 0 12px 32px rgba(45, 122, 79, 0.3);
  }

  .result-banner.red {
    background: var(--alert);
    color: white;
    box-shadow: 0 12px 32px rgba(192, 57, 43, 0.3);
  }

  .result-banner.yellow {
    background: var(--warn);
    color: white;
    box-shadow: 0 12px 32px rgba(212, 160, 23, 0.3);
  }

  .result-banner .big-icon {
    font-size: 64px;
    margin-bottom: 12px;
    display: block;
    line-height: 1;
  }

  .result-banner .big-text {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 10px;
  }

  .result-banner .sub-text {
    font-size: 14px;
    opacity: 0.95;
    line-height: 1.4;
  }

  /* WAITING */
  .waiting-card {
    background: var(--paper);
    border: 2px solid var(--warn);
    border-radius: 20px;
    padding: 32px 20px;
    margin: 16px 0;
    text-align: center;
  }

  .waiting-icon {
    width: 56px;
    height: 56px;
    border: 4px solid var(--warn);
    border-top-color: transparent;
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 1s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .waiting-title {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .waiting-sub {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.4;
  }

  .countdown {
    font-family: 'Geist Mono', monospace;
    font-size: 13px;
    color: var(--warn);
    margin-top: 12px;
    font-weight: 600;
  }

  /* CHOICE CARD (na ekranie syna gdy mama pyta) */
  .choice-card {
    background: var(--paper);
    border: 3px solid var(--alert);
    border-radius: 22px;
    padding: 20px;
    margin: 16px 0;
    box-shadow: 0 12px 32px rgba(192, 57, 43, 0.2);
    animation: bigPop 0.4s ease;
  }

  .choice-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--alert);
    margin-bottom: 12px;
    font-weight: 600;
  }

  .choice-header .badge {
    width: 20px;
    height: 20px;
    background: var(--alert);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 12px;
    font-family: inherit;
  }

  .choice-title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 8px;
    letter-spacing: -0.01em;
    line-height: 1.15;
  }

  .choice-body {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin-bottom: 18px;
  }

  .choice-body strong { color: var(--ink); }

  .choice-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .choice-btn {
    padding: 18px;
    border-radius: 14px;
    border: none;
    font-family: inherit;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .choice-btn:active { transform: scale(0.97); }
  .choice-btn.confirm { background: var(--trust); color: white; }
  .choice-btn.deny { background: var(--alert); color: white; }
  .choice-btn .icon-l { font-size: 22px; }

  /* ROZŁĄCZ BUTTON */
  .hangup-btn {
    background: var(--ink);
    color: white;
    border: none;
    border-radius: 16px;
    padding: 20px;
    font-family: inherit;
    font-weight: 700;
    font-size: 16px;
    width: 100%;
    margin-top: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
  }

  .hangup-btn:active { transform: scale(0.97); }

  /* CALL BAR */
  .call-bar {
    position: absolute;
    top: env(safe-area-inset-top, 0px);
    left: 0;
    right: 0;
    background: var(--trust);
    color: white;
    padding: 6px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-family: 'Geist Mono', monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    z-index: 50;
    margin-top: 48px;
  }

  .call-bar.unknown { background: var(--ink); }
  .call-bar.alert { background: var(--alert); }

  .call-bar .pulse-dot {
    width: 8px;
    height: 8px;
    background: white;
    border-radius: 50%;
    animation: pulseDot 1.2s infinite;
  }

  @keyframes pulseDot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .call-bar .duration { margin-left: auto; opacity: 0.8; font-weight: 500; }

  /* RIPPLE */
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    transform: scale(0);
    animation: rippleAnim 0.6s ease-out;
    pointer-events: none;
  }

  @keyframes rippleAnim {
    to {
      transform: scale(4);
      opacity: 0;
    }
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: white;
    padding: 12px 20px;
    border-radius: 100px;
    font-size: 13px;
    z-index: 200;
    animation: toastUp 0.3s ease;
  }

  @keyframes toastUp {
    from { transform: translate(-50%, 30px); opacity: 0; }
    to { transform: translate(-50%, 0); opacity: 1; }
  }

  /* INSTALL HINT */
  .install-hint {
    background: var(--ink);
    color: var(--paper);
    padding: 12px 16px;
    border-radius: 12px;
    margin-bottom: 16px;
    font-size: 12px;
    line-height: 1.4;
    display: none;
  }

  .install-hint.show { display: block; }
  .install-hint strong { color: var(--accent); }

  /* TIMELINE - alarm history */
  .alarm-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .alarm-item {
    background: var(--paper);
    border: 1px solid var(--line);
    border-left: 4px solid var(--trust);
    border-radius: 12px;
    padding: 12px 14px;
  }

  .alarm-item.alert { border-left-color: var(--alert); }
  .alarm-item.warn { border-left-color: var(--warn); }

  .alarm-time {
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    margin-bottom: 4px;
    letter-spacing: 0.05em;
  }

// ====== QR CODE GENERATOR (simple visual placeholder) ======
function makeQR() {
  const size = 21;
  const cells = [];
  // Pseudo-random pattern based on seeded values
  const seed = 0xDEADBEEF;
  let r = seed;
  for (let i = 0; i < size * size; i++) {
    r = (r * 1103515245 + 12345) & 0x7FFFFFFF;
    cells.push(r % 2);
  }
  // Add corner markers (finder patterns)
  function setFinder(x, y) {
    for (let dy = 0; dy < 7; dy++) {
      for (let dx = 0; dx < 7; dx++) {
        const idx = (y + dy) * size + (x + dx);
        const edge = dx === 0 || dy === 0 || dx === 6 || dy === 6;
        const inner = dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4;
        cells[idx] = (edge || inner) ? 1 : 0;
      }
    }
  }
  setFinder(0, 0);
  setFinder(size - 7, 0);
  setFinder(0, size - 7);

  let svg = '<svg class="qr-code" viewBox="0 0 ' + size + ' ' + size + '" xmlns="http://www.w3.org/2000/svg">';
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      if (cells[y * size + x]) {
        svg += `<rect x="${x}" y="${y}" width="1" height="1" fill="#14171c"/>`;
      }
    }
  }
  svg += '</svg>';
  return svg;
}

        ${icon.phoneOff}
        ROZŁĄCZ NATYCHMIAST
      </button>
      <div class="alarm-item alert" style="margin-top: 16px;">
        <div class="alarm-time">Powiadomiono również</div>
        <div class="alarm-text">Syn, Ania (córka) i Mąż otrzymali alert o próbie oszustwa</div>
      </div>
      <button class="add-btn" onclick="goHome()" style="background: var(--ink); margin-top: 12px;">Zgłoś numer</button>
    </div>
  `;
}

function renderResultYellow() {
  return renderHeader('Mama', 'M', 'mama-c') + `
    <div class="call-bar unknown"><div class="pulse-dot"></div><span>Rozmowa: niepotwierdzona</span><span class="duration">03:01</span></div>
    <div class="screen-content">
      <div class="overlay-header" style="padding-left: 0;">
        <div class="overlay-title">Brak odpowiedzi</div>
      </div>
      <div class="result-banner yellow">
        <span class="big-icon">?</span>
        <div class="big-text">Syn nie odpowiedział</div>
        <div class="sub-text"><strong>Bądź ostrożna.</strong><br>Nie wiemy czy to on. Zadzwoń sama do Syna z innego numeru, aby sprawdzić.</div>
      </div>
      <button class="add-btn" onclick="goHome()">Wróć do listy</button>
    </div>
  `;
}

function renderSonChoice() {
  return renderHeader('Twój widok', 'T', '') + `
    <div class="screen-content">
      <div class="choice-card">
        <div class="choice-header">
          <div class="badge">!</div>
          PILNE — MAMA SPRAWDZA TOŻSAMOŚĆ
        </div>
        <div class="choice-title">Czy dzwonisz teraz do Mamy?</div>
        <div class="choice-body">Ktoś rozmawia z Mamą i twierdzi, że jest Tobą. Potwierdź lub zaprzecz — <strong>natychmiast</strong>.</div>
        <div class="choice-actions">
          <button class="choice-btn confirm" onclick="answerCall(true)">
            <span class="icon-l">${icon.check}</span>
            TAK, TO JA DZWONIĘ
          </button>
          <button class="choice-btn deny" onclick="answerCall(false)">
            <span class="icon-l">${icon.cross}</span>
            NIE, TO NIE JA
          </button>
        </div>
      </div>
      <div class="subtitle" style="text-align: center;">Twoja odpowiedź dotrze do Mamy w 1 sekundę.</div>
    </div>
  `;
}

function renderSonAnswered(confirmed) {
  return renderHeader('Twój widok', 'T', '') + `
    <div class="screen-content">
      <div class="result-banner ${confirmed ? 'green' : 'red'}">
        <span class="big-icon">${confirmed ? icon.check : icon.alert}</span>
        <div class="big-text">${confirmed ? 'Mama wie że to Ty' : 'Ostrzegliśmy Mamę'}</div>
        <div class="sub-text">${confirmed ?
          'Wysłaliśmy potwierdzenie.<br>Mama widzi już zielony znak.' :
          'Mama widzi czerwony alarm.<br>Zadzwoń do niej, aby się upewnić że jest bezpieczna.'}</div>
      </div>
      ${!confirmed ? `
        <div class="alarm-item alert" style="margin-top: 16px;">
          <div class="alarm-time">Powiadomieni zostali również</div>
          <div class="alarm-text">Tata i Ania (siostra) o próbie oszustwa</div>
        </div>
      ` : ''}
      <button class="add-btn" onclick="goHome()">Wróć do listy</button>
    </div>
  `;
}

// ====== MAIN RENDER ======
function render() {
  const app = document.getElementById('app');
  let html = '';

  if (state.screen === 'pairing') {
    html = renderPairing();
  } else if (state.view === 'mama') {
    if (state.screen === 'home') html = renderMamaHome();
    else if (state.screen === 'verifying') html = renderVerifying();
    else if (state.screen === 'result-green') html = renderResultGreen();
    else if (state.screen === 'result-red') html = renderResultRed();
    else if (state.screen === 'result-yellow') html = renderResultYellow();
  } else {
    // son view
    if (state.screen === 'home') html = renderSonHome();
    else if (state.screen === 'choice') html = renderSonChoice();
    else if (state.screen === 'answered-yes') html = renderSonAnswered(true);
    else if (state.screen === 'answered-no') html = renderSonAnswered(false);
  }

  app.innerHTML = html;
  renderPresenterActions();
}

// ====== ACTIONS ======
function switchView(view) {
  state.view = view;
  state.screen = 'home';
  state.pairingStep = 0;
  document.getElementById('view-mama').classList.toggle('active', view === 'mama');
  document.getElementById('view-son').classList.toggle('active', view === 'son');
  render();
}

function goHome() {
  state.screen = 'home';
  state.pairingStep = 0;
  if (state.countdownTimer) {
    clearInterval(state.countdownTimer);
    state.countdownTimer = null;
  }
  render();
}

function openPairing() {
  state.screen = 'pairing';
  state.pairingStep = 0;
  render();
}

function setPairingMethod(m) {
  state.pairingMethod = m;
  render();
}

function startVerify() {
  state.screen = 'verifying';
  state.countdown = 30;
  render();
  // simulate son receiving request — switch to son view if presenting
  // (but don't auto-switch; let user demo it)
  startCountdown();
}

function startCountdown() {
  if (state.countdownTimer) clearInterval(state.countdownTimer);
  state.countdownTimer = setInterval(() => {
    state.countdown--;
    const el = document.getElementById('countdown-display');
    if (el) el.textContent = `Pozostało ${state.countdown}s`;
    if (state.countdown <= 0) {
      clearInterval(state.countdownTimer);
      state.countdownTimer = null;
      // timeout
      if (state.screen === 'verifying') {
        state.screen = 'result-yellow';
        render();
      }
    }
  }, 1000);
}

function openContact(id) {
  showToast('Szczegóły kontaktu — wkrótce');
}

function answerCall(confirmed) {
  state.screen = confirmed ? 'answered-yes' : 'answered-no';
  render();
  // also flag mama side will get result on next view switch
  if (confirmed) {
    state._mamaPendingResult = 'green';
  } else {
    state._mamaPendingResult = 'red';
  }
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

function togglePresenter() {
  state.presenterOpen = !state.presenterOpen;
  document.getElementById('presenter-panel').classList.toggle('show', state.presenterOpen);
  renderPresenterActions();
}

function renderPresenterActions() {
  const el = document.getElementById('presenter-actions');
  if (!el) return;
  const actions = [];

  if (state.view === 'mama') {
    if (state.screen === 'home') {
      actions.push({ label: '📞 Symuluj przychodzące', action: () => { state.callActive = true; render(); }});
      actions.push({ label: 'Zakończ rozmowę', action: () => { state.callActive = false; render(); }});
      actions.push({ label: 'Skok do alarmu (oszust)', action: () => { state.callActive = true; state.screen = 'result-red'; render(); }});
      actions.push({ label: 'Skok do zielonego ✓', action: () => { state.callActive = true; state.screen = 'result-green'; render(); }});
      actions.push({ label: 'Otwórz QR (parowanie)', action: () => { state.screen = 'pairing'; state.pairingStep = 1; state.pairingMethod = 'qr'; render(); }});
    }
    if (state.screen === 'verifying') {
      actions.push({ label: '→ Wynik: ZIELONY', action: () => { if(state.countdownTimer) clearInterval(state.countdownTimer); state.screen = 'result-green'; render(); }});
      actions.push({ label: '→ Wynik: CZERWONY', action: () => { if(state.countdownTimer) clearInterval(state.countdownTimer); state.screen = 'result-red'; render(); }});
      actions.push({ label: '→ Wynik: ŻÓŁTY (timeout)', action: () => { if(state.countdownTimer) clearInterval(state.countdownTimer); state.screen = 'result-yellow'; render(); }});
    }
  } else {
    if (state.screen === 'home') {
      actions.push({ label: '📲 Mama wysłała prośbę', action: () => { state.screen = 'choice'; render(); }});
      actions.push({ label: 'Otwórz QR (parowanie)', action: () => { state.screen = 'pairing'; state.pairingStep = 1; state.pairingMethod = 'qr'; render(); }});
    }
  }

  actions.push({ label: '↺ Reset całego demo', action: () => { state.callActive = false; goHome(); }});

  el.innerHTML = actions.map((a, i) =>
    `<button class="presenter-btn" data-i="${i}">${a.label}</button>`
  ).join('');
  el.querySelectorAll('.presenter-btn').forEach((b, i) => {
    b.onclick = actions[i].action;
  });
}

// ====== INIT ======
render();

// Service worker for PWA installability
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
